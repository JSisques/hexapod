name: software

# No path filters: the check always runs, so a required status never stays pending.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: software-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Quality gate
        run: make software
      - name: Pose report and plots
        run: make software-report
      - name: Upload report and plots
        uses: actions/upload-artifact@v7
        with:
          name: software-report
          path: |
            build/software/*.png
            build/software/report.md
          retention-days: 14
          if-no-files-found: error
